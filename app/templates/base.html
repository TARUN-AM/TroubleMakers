<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vulnerability Watch{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="/" class="logo">
        <div class="logo-symbol">VW</div>
        <div class="logo-text">Vulnerability Watch</div>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/api/health" class="nav-link mono" target="_blank">Health</a>
        <a href="https://github.com" class="nav-link" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      Vulnerability Watch &mdash; Autonomous Multi-Agent Security Remediation
    </div>
  </footer>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
